[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/lucas-s-b/ProjectCAD"

# Optimize dependencies (manifold booleans, parry, faer) in debug builds; workspace crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2

# The FEA element loops and the mesher are workspace code; unoptimized they take seconds per study in debug builds.
[profile.dev.package.cad-analysis]
opt-level = 2
